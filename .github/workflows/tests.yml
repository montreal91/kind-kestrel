name: Run RLC Internal Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install required native dependencies
      run: sudo apt-get update && sudo apt-get install -y clang libz-dev libstdc++6

    - name: Grant execute permission for Gradle
      run: cd rlc/; chmod +x gradlew;

    - name: Run Kotlin/Native tests
      run: cd rlc/; ./gradlew allTests --info;
